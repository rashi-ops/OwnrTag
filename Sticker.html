<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OwnrTag — Print Sticker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600&family=Inter:wght@400;500;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #f0f0f0;
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .sticker {
    width: 100mm;
    height: 140mm;
    background: #14171D;
    border-radius: 12px;
    border: 3px solid #FFB020;
    padding: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    position: relative;
    overflow: hidden;
  }

  .sticker::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: repeating-linear-gradient(-45deg, #FFB020 0 8px, #14171D 8px 16px);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #FFB020;
    margin: 10px 0 12px;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    letter-spacing: 0.12em;
    font-size: 13px;
    text-transform: uppercase;
  }

  .brand svg { width: 16px; height: 16px; }

  .qr-wrap {
    background: #F3F1E9;
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 12px;
    width: 72mm;
    height: 72mm;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .qr-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .plate {
    background: #F7EFC8;
    color: #14171D;
    border-radius: 5px;
    border: 2px solid #14171D;
    display: flex;
    overflow: hidden;
    width: 100%;
    max-width: 78mm;
    margin-bottom: 10px;
  }

  .plate-strip {
    background: #1447E6;
    color: #fff;
    font-family: 'Oswald', sans-serif;
    font-size: 9px;
    font-weight: 600;
    writing-mode: vertical-rl;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 5px 3px;
    letter-spacing: 0.1em;
  }

  .plate-number {
    flex: 1;
    text-align: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 0.08em;
    padding: 5px 6px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .scan-text {
    color: #9AA0AE;
    font-size: 11px;
    text-align: center;
    line-height: 1.5;
    margin-bottom: 8px;
  }

  .scan-text strong {
    color: #F3F1E9;
    display: block;
    font-size: 13px;
    margin-bottom: 2px;
  }

  .footer {
    margin-top: auto;
    text-align: center;
    color: #2E7D5B;
    font-size: 10px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .footer svg { width: 12px; height: 12px; }

  @media print {
    body { background: white; padding: 0; }
    .sticker { box-shadow: none; }
    .no-print { display: none; }
  }

  .no-print {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #FFB020;
    color: #4A2E02;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    border: none;
    font-family: 'Inter', sans-serif;
  }

  .no-print:hover { background: #e6a01d; }
</style>
<base target="_blank">
